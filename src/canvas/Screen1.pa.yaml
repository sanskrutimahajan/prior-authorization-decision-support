            - conFooter:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: '=10  '
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Visible: '=true    '
                Children:
                  - TextInput4:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: '="Search cases"  '
                        BorderColor: =RGBA(245, 245, 245, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: '=""  '
                        DelayOutput: '=true    '
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Font: =Font.'Segoe UI'
                        HintText: "=\"Search case # or patient\"  "
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =RGBA(0, 120, 212, 1)
                        PressedColor: =RGBA(50, 49, 48, 1)
                        PressedFill: =RGBA(255, 255, 255, 1)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: '=280 '
                  - Dropdown4:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: '="Filter by status"  '
                        BorderColor: =RGBA(245, 245, 245, 1)
                        ChevronBackground: =RGBA(245, 245, 245, 1)
                        ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                        ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                        ChevronFill: =RGBA(50, 49, 48, 1)
                        ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                        ChevronHoverFill: =RGBA(50, 49, 48, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: '="All statuses"  '
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(245, 245, 245, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(245, 245, 245, 1)
                        Items: '=["All statuses", "Pending", "In Review", "Approved", "Denied"]  '
                        Items.Value: =Value
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedBorderColor: =RGBA(16, 110, 190, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        SelectionColor: =RGBA(50, 49, 48, 1)
                        SelectionFill: =RGBA(0, 120, 212, 1)
                        Width: '=160 '
                  - Dropdown5:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: '="Filter by payer"   '
                        BorderColor: =RGBA(245, 245, 245, 1)
                        ChevronBackground: =RGBA(245, 245, 245, 1)
                        ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                        ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                        ChevronFill: =RGBA(50, 49, 48, 1)
                        ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                        ChevronHoverFill: =RGBA(50, 49, 48, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: '="All payers"    '
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(245, 245, 245, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(245, 245, 245, 1)
                        Items: "=Ungroup(Table({Rows: Table({Value: \"All payers\"})}, {Rows: Sort(Distinct('Prior Authorization Cases', Payer), Value)}), Rows)   "
                        Items.Value: =Value
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedBorderColor: =RGBA(16, 110, 190, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        SelectionColor: =RGBA(50, 49, 48, 1)
                        SelectionFill: =RGBA(0, 120, 212, 1)
                        Width: '=180 '
                  - TextInput5:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: '="Filter by reviewer"    '
                        BorderColor: =RGBA(245, 245, 245, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: '=""  '
                        DelayOutput: '=true    '
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Font: =Font.'Segoe UI'
                        HintText: ="Reviewer email"
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(255, 255, 255, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =RGBA(0, 120, 212, 1)
                        PressedColor: =RGBA(50, 49, 48, 1)
                        PressedFill: =RGBA(255, 255, 255, 1)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: '=230 '
                  - Dropdown6:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: '="Filter by urgency" '
                        BorderColor: =RGBA(245, 245, 245, 1)
                        ChevronBackground: =RGBA(245, 245, 245, 1)
                        ChevronDisabledBackground: =RGBA(242, 242, 241, 0)
                        ChevronDisabledFill: =RGBA(161, 159, 157, 1)
                        ChevronFill: =RGBA(50, 49, 48, 1)
                        ChevronHoverBackground: =RGBA(245, 245, 245, 1)
                        ChevronHoverFill: =RGBA(50, 49, 48, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: '="All urgency"   '
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(245, 245, 245, 1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(16, 110, 190, 1)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(245, 245, 245, 1)
                        Items: '=["All urgency", "Urgent", "Routine"]    '
                        Items.Value: =Value
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedBorderColor: =RGBA(16, 110, 190, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 120, 212, 1)
                        SelectionColor: =RGBA(50, 49, 48, 1)
                        SelectionFill: =RGBA(0, 120, 212, 1)
                        Width: '=150 '
                  - Button2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(51,65,85,1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(241,245,249,1)
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(16, 110, 190, 1)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: '=Reset(TextInput4); Reset(Dropdown4); Reset(Dropdown5); Reset(TextInput5); Reset(Dropdown6)  '
                        PressedBorderColor: =RGBA(0, 69, 120, 1)
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(16, 110, 190, 1)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Text: '="Clear" '
                        Width: '=90  '
            - conBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =16
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - conKPI:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Horizontal_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(245, 245, 245, 1)
                        FillPortions: =0
                        Height: =120
                        Items: |-
                          =Table({KPI: "Total Cases", Value: CountIf('Prior Authorization Cases', true)}, {KPI: "Pending", Value: CountIf('Prior Authorization Cases', 'Status (cr36f_status)' = 'Status (Prior Authorization Cases)'.Pending)}, {KPI: "In Review", Value: CountIf('Prior Authorization Cases', 'Status (cr36f_status)' = 'Status (Prior Authorization Cases)'.'In Review')}, {KPI: "Approved", Value: CountIf('Prior Authorization Cases', 'Status (cr36f_status)' = 'Status (Prior Authorization Cases)'.Approved)}, {KPI: "Denied", Value: CountIf('Prior Authorization Cases', 'Status (cr36f_status)' = 'Status (Prior Authorization Cases)'.Denied)})
                        LayoutMinHeight: =130
                        LayoutMinWidth: =15
                        TemplateSize: =Self.Width / 5
                      Children:
                        - conTotalCases:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =108
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              PaddingBottom: =8
                              PaddingLeft: =20
                              PaddingRight: =20
                              PaddingTop: =12
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.TemplateWidth - 16
                              Y: =4
                            Children:
                              - lblTotalCasesTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =RGBA(100, 116, 139, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =28
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Text: =ThisItem.KPI
                              - lblTotalCasesValue:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =RGBA(15, 23, 42, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =52
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =28
                                    Text: =ThisItem.Value
                  - lblCasesTitle:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =RGBA(15, 23, 42, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =18
                        Text: '=If(IsEmpty(galcases.AllItems), "No cases match these filters", "Cases") '
                  - HtmlText1_1:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        DisabledBorderColor: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Segoe UI'
                        HtmlText: ="<div style='display:flex;align-items:center;height:40px;background:#F1F5F9;color:#475569;font-family:Segoe UI;font-size:13px;font-weight:600;'><div style='width:28%;box-sizing:border-box;padding-left:32px;'>Case Number</div><div style='width:42%;box-sizing:border-box;padding-left:12px;'>Patient Name</div><div style='width:30%;box-sizing:border-box;padding-left:5px;'>Status</div></div>"
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        X: =40
                        Y: =40
                  - galcases:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(226, 232, 240, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        Items: "=Sort(Filter('Prior Authorization Cases', (IsBlank(Trim(TextInput4.Text)) || StartsWith('Case Number', Trim(TextInput4.Text)) || StartsWith('Patient Name', Trim(TextInput4.Text))) && (Dropdown4.Selected.Value = \"All statuses\" || (Dropdown4.Selected.Value = \"Pending\" && 'Status (cr36f_status)' = 'Status (Prior Authorization Cases)'.Pending) || (Dropdown4.Selected.Value = \"In Review\" && 'Status (cr36f_status)' = 'Status (Prior Authorization Cases)'.'In Review') || (Dropdown4.Selected.Value = \"Approved\" && 'Status (cr36f_status)' = 'Status (Prior Authorization Cases)'.Approved) || (Dropdown4.Selected.Value = \"Denied\" && 'Status (cr36f_status)' = 'Status (Prior Authorization Cases)'.Denied)) && (Dropdown5.Selected.Value = \"All payers\" || Payer = Dropdown5.Selected.Value) && (IsBlank(Trim(TextInput5.Text)) || StartsWith('Assigned Reviewer', Trim(TextInput5.Text))) && (Dropdown6.Selected.Value = \"All urgency\" || (Dropdown6.Selected.Value = \"Urgent\" && Urgent = true) || (Dropdown6.Selected.Value = \"Routine\" && Urgent = false))), 'Case Number', SortOrder.Ascending)    "
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set(varSelectedCase, ThisItem); Set(varAnalyzed, false); Navigate(scrCaseDetails, ScreenTransition.Fade)
                        TemplateSize: =56
                      Children:
                        - CaseNumber:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(30, 64, 175, 1)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =56
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Text: =ThisItem.'Case Number'
                              Width: =Parent.TemplateWidth * 0.24
                              X: =20
                        - PatientName:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(51, 65, 85, 1)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                              Height: =56
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =0
                              PaddingTop: =0
                              Text: =ThisItem.'Patient Name'
                              Width: =Parent.Width * 0.38
                              X: =Parent.Width * 0.28
                        - NextArrow5:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: =Self.Tooltip
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(37, 99, 235, 1)
                              DisabledBorderColor: =RGBA(56, 56, 56, 1)
                              DisabledColor: =RGBA(119, 119, 119, 1)
                              Height: =40
                              Icon: =Icon.ChevronRight
                              OnSelect: =Select(Parent)
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Tooltip: ="View item details"
                              Width: =40
                              X: =Parent.Width - Self.Width - 12
                              Y: =8
                        - Separator8:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(226, 232, 240, 1)
                              Height: =1
                              OnSelect: =Select(Parent)
                              Width: =Parent.Width
                              Y: =Parent.TemplateHeight - 1
                        - Rectangle5:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 120, 212, 1)
                              Height: =Parent.TemplateHeight - Separator8.Height
                              OnSelect: =Select(Parent)
                              Visible: =ThisItem.IsSelected
                              Width: =4
                        - Label6:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              Color: =RGBA(71, 85, 105, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              FocusedBorderThickness: =4
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =56
                              OnSelect: =Select(Parent)
                              Size: =12
                              Text: =Coalesce(Text(ThisItem.'Status (cr36f_status)'), "—")
                              Width: =Parent.TemplateWidth * 0.20
                              X: =Parent.Width * 0.70
