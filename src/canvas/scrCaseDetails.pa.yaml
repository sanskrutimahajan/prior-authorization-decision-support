                  Size: =10
                  Text: "=Substitute(ThisItem.'Required Evidence', \"Demonstration \", \"\") & If(Text(ThisItem.'Rule Type') = \"Minimum Duration\", \" (minimum \" & Text(ThisItem.'Minimum Duration') & If(ThisItem.'Requirement Name' = \"Physical Therapy\", \" weeks)\", \" months)\"), \"\")    "
