Screens:
  scrCaseDetails:
    Properties:
      Fill: =RGBA(248,250,252,1)
      OnVisible: '=Set(varShowHistory, false); Reset(TextInput1); Reset(TextInput2); Reset(TextInput3); Set(varAnalyzed, false); Clear(colAuthorizationResults); Reset(chkImaging); Reset(chkMedication); Reset(chkSpecialist); Reset(chkFunction); Reset(chkConservative); Reset(txtPTWeeks); Reset(txtSymptomMonths); Reset(txtAssignedReviewer) '
