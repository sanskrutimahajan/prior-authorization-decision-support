          Properties:
            Color: =RGBA(153,27,27,1)
            DisplayMode: '=If(varShowHistory, DisplayMode.Disabled, DisplayMode.Edit)  '
            Fill: =RGBA(254,226,226,1)
            OnSelect: "=If(IsBlank(Trim(TextInput1.Text)) || IsBlank(Trim(txtAssignedReviewer.Text)), Notify(\"Enter a reviewer and a reason for the status change.\", NotificationType.Error), With({currentCase: LookUp('Prior Authorization Cases', 'Prior Authorization Case' = varSelectedCase.'Prior Authorization Case')}, If(Text(currentCase.'Status (cr36f_status)') = \"Denied\", Set(varSelectedCase, currentCase); Notify(\"This case already has that status.\", NotificationType.Information), IfError(Set(varDecisionEvent, Patch('Authorization Decisions', Defaults('Authorization Decisions'), {'Decision Name': Text(GUID()), 'Authorization Case': currentCase, 'Decision Time': Now(), 'Previous Status': Text(currentCase.'Status (cr36f_status)'), 'New Status': \"Denied\", Reviewer: Trim(txtAssignedReviewer.Text), Reason: Trim(TextInput1.Text), 'Reviewer Notes': Trim(TextInput2.Text), Outcome: \"Pending\"})); IfError(Set(varSelectedCase, Patch('Prior Authorization Cases', currentCase, {'Status (cr36f_status)': 'Status (Prior Authorization Cases)'.Denied, 'Assigned Reviewer': Trim(txtAssignedReviewer.Text)})); IfError(Patch('Authorization Decisions', varDecisionEvent, {Outcome: \"Applied\"}); Refresh('Authorization Decisions'); Reset(TextInput1); Reset(TextInput2); Reset(TextInput3); Notify(\"Status and decision history saved.\", NotificationType.Success), Notify(\"Status saved. The history entry needs reconciliation; do not resubmit this decision.\", NotificationType.Error)), Patch('Authorization Decisions', varDecisionEvent, {Outcome: \"Failed\"}); Notify(\"Status was not saved. Please retry.\", NotificationType.Error)), Notify(\"Could not create the decision record. Status is unchanged.\", NotificationType.Error))))) "
            Size: =12
            Text: ="Denied"
            Width: =Parent.Width / 8 - 19
            X: =btnStatusApproved.X + btnStatusApproved.Width + 8
            Y: =664
      - lblDemoNote:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(15,23,42,1)
            Font: =Font.'Segoe UI'
            Height: =28
            Size: =10
            Text: ="Demonstration rules only. Not clinical guidance."
            Width: =1270
            X: =24
            Y: =724
      - TextInput1:
          Control: Classic/TextInput@2.3.2
          Properties:
            AccessibleLabel: '="Reason for status change"  '
            BorderColor: =RGBA(245, 245, 245, 1)
