            Default: =varSelectedCase.'Medication Trial' = true
            Height: =40
            OnCheck: =Set(varAnalyzed, false)
            OnUncheck: =Set(varAnalyzed, false)
            Size: =12
            Text: ="Medication Trial"
            Width: =590
            X: =24
            Y: =293
      - chkSpecialist:
          Control: Classic/CheckBox@2.1.0
          Properties:
            Default: =varSelectedCase.'Specialist Evaluation' = true
            Height: =40
            OnCheck: =Set(varAnalyzed, false)
            OnUncheck: =Set(varAnalyzed, false)
            Size: =12
            Text: ="Specialist Evaluation"
            Width: =590
            X: =24
            Y: =336
      - chkFunction:
          Control: Classic/CheckBox@2.1.0
          Properties:
            Default: =varSelectedCase.'Functional Limitation' = true
            Height: =40
            OnCheck: =Set(varAnalyzed, false)
            OnUncheck: =Set(varAnalyzed, false)
            Size: =12
            Text: ="Functional Limitation"
            Width: =590
            X: =24
            Y: =379
      - chkConservative:
          Control: Classic/CheckBox@2.1.0
          Properties:
            Default: =varSelectedCase.'Conservative Treatment Failed' = true
            Height: =40
            OnCheck: '=Set(varAnalyzed, false) '
            OnUncheck: '=Set(varAnalyzed, false) '
            Size: =12
            Text: ="Conservative Treatment Failed"
            Width: =590
            X: =24
            Y: =422
      - lblPTWeeks:
          Control: Label@2.5.1
