                  Size: =12
                  Text: =ThisItem.Result
                  Width: =100
                  X: =Parent.TemplateWidth - 105
      - btnAnalyzeAuthorization:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =Color.White
            Fill: =RGBA(15,108,189,1)
            OnSelect: "=If(IsBlank(txtPTWeeks.Text) || IsBlank(txtSymptomMonths.Text) || Value(txtPTWeeks.Text) < 0 || Value(txtSymptomMonths.Text) < 0 || Mod(Value(txtPTWeeks.Text),1) <> 0 || Mod(Value(txtSymptomMonths.Text),1) <> 0, Notify(\"Enter non-negative whole numbers for both durations.\", NotificationType.Error), IfError(Set(varSelectedCase, Patch('Prior Authorization Cases', varSelectedCase, {'Physical Therapy Weeks': Value(txtPTWeeks.Text), 'Symptoms Duration Months': Value(txtSymptomMonths.Text), 'Imaging Available': chkImaging.Value, 'Medication Trial': chkMedication.Value, 'Specialist Evaluation': chkSpecialist.Value, 'Functional Limitation': chkFunction.Value, 'Conservative Treatment Failed': chkConservative.Value, 'Assigned Reviewer': Trim(txtAssignedReviewer.Text)})); ClearCollect(colAuthorizationResults, AddColumns(Filter('Prior Authorization Requirements', Payer = varSelectedCase.Payer && Treatment = varSelectedCase.Treatment && Diagnosis = varSelectedCase.Diagnosis && Active = true) As rule, Result, If(Switch(rule.'Requirement Name', \"Confirmed Diagnosis\", !IsBlank(Trim(varSelectedCase.Diagnosis)), \"Imaging Available\", varSelectedCase.'Imaging Available' = true, \"Physical Therapy\", !IsBlank(varSelectedCase.'Physical Therapy Weeks') && varSelectedCase.'Physical Therapy Weeks' >= rule.'Minimum Duration', \"Medication Trial\", varSelectedCase.'Medication Trial' = true, \"Specialist Evaluation\", varSelectedCase.'Specialist Evaluation' = true, \"Symptoms Duration\", !IsBlank(varSelectedCase.'Symptoms Duration Months') && varSelectedCase.'Symptoms Duration Months' >= rule.'Minimum Duration', \"Functional Limitation\", varSelectedCase.'Functional Limitation' = true, \"Conservative Treatment Failed\", varSelectedCase.'Conservative Treatment Failed' = true, false), \"Met\", \"Missing\"))); Set(varAnalyzed, true), Notify(\"Could not save or analyze. Please retry.\", NotificationType.Error)))  "
            Size: =12
            Text: ="Save and check requirements"
            Width: =310
            X: =24
            Y: =664
      - btnStatusPending:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(51,65,85,1)
            DisplayMode: '=If(varShowHistory, DisplayMode.Disabled, DisplayMode.Edit)  '
            Fill: =RGBA(226,232,240,1)
            OnSelect: "=If(IsBlank(Trim(TextInput1.Text)) || IsBlank(Trim(txtAssignedReviewer.Text)), Notify(\"Enter a reviewer and a reason for the status change.\", NotificationType.Error), With({currentCase: LookUp('Prior Authorization Cases', 'Prior Authorization Case' = varSelectedCase.'Prior Authorization Case')}, If(Text(currentCase.'Status (cr36f_status)') = \"Pending\", Set(varSelectedCase, currentCase); Notify(\"This case already has that status.\", NotificationType.Information), IfError(Set(varDecisionEvent, Patch('Authorization Decisions', Defaults('Authorization Decisions'), {'Decision Name': Text(GUID()), 'Authorization Case': currentCase, 'Decision Time': Now(), 'Previous Status': Text(currentCase.'Status (cr36f_status)'), 'New Status': \"Pending\", Reviewer: Trim(txtAssignedReviewer.Text), Reason: Trim(TextInput1.Text), 'Reviewer Notes': Trim(TextInput2.Text), Outcome: \"Pending\"})); IfError(Set(varSelectedCase, Patch('Prior Authorization Cases', currentCase, {'Status (cr36f_status)': 'Status (Prior Authorization Cases)'.Pending, 'Assigned Reviewer': Trim(txtAssignedReviewer.Text)})); IfError(Patch('Authorization Decisions', varDecisionEvent, {Outcome: \"Applied\"}); Refresh('Authorization Decisions'); Reset(TextInput1); Reset(TextInput2); Reset(TextInput3); Notify(\"Status and decision history saved.\", NotificationType.Success), Notify(\"Status saved. The history entry needs reconciliation; do not resubmit this decision.\", NotificationType.Error)), Patch('Authorization Decisions', varDecisionEvent, {Outcome: \"Failed\"}); Notify(\"Status was not saved. Please retry.\", NotificationType.Error)), Notify(\"Could not create the decision record. Status is unchanged.\", NotificationType.Error)))))  "
            Size: =12
            Text: ="Pending"
            Width: =Parent.Width / 8 - 19
            X: =Parent.Width / 2 + 16
            Y: =664
      - btnStatusInReview:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(30,64,175,1)
            DisplayMode: '=If(varShowHistory, DisplayMode.Disabled, DisplayMode.Edit)  '
            Fill: =RGBA(219,234,254,1)
            OnSelect: "=If(IsBlank(Trim(TextInput1.Text)) || IsBlank(Trim(txtAssignedReviewer.Text)), Notify(\"Enter a reviewer and a reason for the status change.\", NotificationType.Error), With({currentCase: LookUp('Prior Authorization Cases', 'Prior Authorization Case' = varSelectedCase.'Prior Authorization Case')}, If(Text(currentCase.'Status (cr36f_status)') = \"In Review\", Set(varSelectedCase, currentCase); Notify(\"This case already has that status.\", NotificationType.Information), IfError(Set(varDecisionEvent, Patch('Authorization Decisions', Defaults('Authorization Decisions'), {'Decision Name': Text(GUID()), 'Authorization Case': currentCase, 'Decision Time': Now(), 'Previous Status': Text(currentCase.'Status (cr36f_status)'), 'New Status': \"In Review\", Reviewer: Trim(txtAssignedReviewer.Text), Reason: Trim(TextInput1.Text), 'Reviewer Notes': Trim(TextInput2.Text), Outcome: \"Pending\"})); IfError(Set(varSelectedCase, Patch('Prior Authorization Cases', currentCase, {'Status (cr36f_status)': 'Status (Prior Authorization Cases)'.'In Review', 'Assigned Reviewer': Trim(txtAssignedReviewer.Text)})); IfError(Patch('Authorization Decisions', varDecisionEvent, {Outcome: \"Applied\"}); Refresh('Authorization Decisions'); Reset(TextInput1); Reset(TextInput2); Reset(TextInput3); Notify(\"Status and decision history saved.\", NotificationType.Success), Notify(\"Status saved. The history entry needs reconciliation; do not resubmit this decision.\", NotificationType.Error)), Patch('Authorization Decisions', varDecisionEvent, {Outcome: \"Failed\"}); Notify(\"Status was not saved. Please retry.\", NotificationType.Error)), Notify(\"Could not create the decision record. Status is unchanged.\", NotificationType.Error)))))  "
            Size: =12
            Text: ="In Review"
            Width: =Parent.Width / 8 - 19
            X: =btnStatusPending.X + btnStatusPending.Width + 8
            Y: =664
      - btnStatusApproved:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(22,101,52,1)
            DisplayMode: '=If(!varShowHistory && varAnalyzed && CountRows(colAuthorizationResults) > 0 && CountIf(colAuthorizationResults, Result = "Missing") = 0, DisplayMode.Edit, DisplayMode.Disabled)    '
            Fill: =RGBA(220,252,231,1)
            OnSelect: "=If(IsBlank(Trim(TextInput1.Text)) || IsBlank(Trim(txtAssignedReviewer.Text)), Notify(\"Enter a reviewer and a reason for the status change.\", NotificationType.Error), With({currentCase: LookUp('Prior Authorization Cases', 'Prior Authorization Case' = varSelectedCase.'Prior Authorization Case')}, If(Text(currentCase.'Status (cr36f_status)') = \"Approved\", Set(varSelectedCase, currentCase); Notify(\"This case already has that status.\", NotificationType.Information), IfError(Set(varDecisionEvent, Patch('Authorization Decisions', Defaults('Authorization Decisions'), {'Decision Name': Text(GUID()), 'Authorization Case': currentCase, 'Decision Time': Now(), 'Previous Status': Text(currentCase.'Status (cr36f_status)'), 'New Status': \"Approved\", Reviewer: Trim(txtAssignedReviewer.Text), Reason: Trim(TextInput1.Text), 'Reviewer Notes': Trim(TextInput2.Text), Outcome: \"Pending\"})); IfError(Set(varSelectedCase, Patch('Prior Authorization Cases', currentCase, {'Status (cr36f_status)': 'Status (Prior Authorization Cases)'.Approved, 'Assigned Reviewer': Trim(txtAssignedReviewer.Text)})); IfError(Patch('Authorization Decisions', varDecisionEvent, {Outcome: \"Applied\"}); Refresh('Authorization Decisions'); Reset(TextInput1); Reset(TextInput2); Reset(TextInput3); Notify(\"Status and decision history saved.\", NotificationType.Success), Notify(\"Status saved. The history entry needs reconciliation; do not resubmit this decision.\", NotificationType.Error)), Patch('Authorization Decisions', varDecisionEvent, {Outcome: \"Failed\"}); Notify(\"Status was not saved. Please retry.\", NotificationType.Error)), Notify(\"Could not create the decision record. Status is unchanged.\", NotificationType.Error)))))   "
            Size: =12
            Text: ="Approved"
            Width: =Parent.Width / 8 - 19
            X: =btnStatusInReview.X + btnStatusInReview.Width + 8
            Y: =664
      - btnStatusDenied:
