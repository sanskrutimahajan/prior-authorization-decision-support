            Height: =48
            Size: =24
            Text: ="Case review"
            Width: =600
            X: =24
            Y: =16
      - lblSelectedCase:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(15,23,42,1)
            Font: =Font.'Segoe UI'
