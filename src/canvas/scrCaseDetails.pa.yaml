          Properties:
            Color: =RGBA(15,23,42,1)
            Font: =Font.'Segoe UI'
            Height: =92
            Size: =12
            Text: |-
              ="Payer: " & Coalesce(varSelectedCase.Payer,"—") & Char(10) & "Treatment: " & Coalesce(varSelectedCase.Treatment,"—") & Char(10) & "Diagnosis: " & Coalesce(varSelectedCase.Diagnosis,"—")
