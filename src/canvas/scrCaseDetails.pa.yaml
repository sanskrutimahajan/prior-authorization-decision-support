            Width: =Parent.Width / 2 - 52
            X: =Parent.Width / 2 + 16
            Y: =158
      - galAuthorizationResults:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Fill: =Color.White
            Height: '=280 '
            Items: =colAuthorizationResults
